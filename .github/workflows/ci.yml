name: Contract CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/validate.py
      - run: uv run ruff format --check scripts
      - run: uv run ruff check scripts

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag product-interface-validator:ci .
      - run: docker run --rm product-interface-validator:ci
