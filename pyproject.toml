[project]
name = "product-interface"
version = "0.1.0"
description = "Canonical OpenAPI contract, schemas and examples for the Microsserv52 Product API."
requires-python = ">=3.14"
readme = "README.md"
license = "LicenseRef-Educational"
dependencies = [
  "jsonschema>=4.25,<5",
  "openapi-spec-validator>=0.7.2,<1",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "ruff>=0.14,<1",
]

[tool.uv]
package = false
